const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

function applyLayout(){
  if(isTouch){
    const sw=Math.round(innerWidth),sh=Math.round(innerHeight);
    const ps=Math.max(2,Math.min(3,Math.round(sh/200)));
    VW=Math.max(320,Math.min(900,Math.round(sw/ps)));
    VH=Math.max(200,Math.min(600,Math.round(sh/ps)));
    cv.width=VW;cv.height=VH;cv.style.width=sw+'px';cv.style.height=sh+'px';
    for(const id of ['crt','vig']){const e=document.getElementById(id);e.style.width=sw+'px';e.style.height=sh+'px';}
  } else {
    VW=480;VH=300;cv.width=VW;cv.height=VH;
    const pad=18,s=Math.min((innerWidth-pad)/VW,(innerHeight-pad)/VH);
    cv.style.width=(VW*s)+'px';cv.style.height=(VH*s)+'px';
    for(const id of ['crt','vig']){const e=document.getElementById(id);e.style.width=cv.style.width;e.style.height=cv.style.height;}
  }
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',applyLayout);
addEventListener('orientationchange',()=>setTimeout(applyLayout,200));

/* ===================== WORLD BUILD ===================== */
// ground codes
const G_WALL=0,G_CONC=1,G_SAND=2,G_WATER=3,G_DARK=4,G_STAGE=5,G_DECK=6,G_WOOD=7;
const ground=[],solid=[];
for(let r=0;r<ROWS;r++){ground[r]=[];solid[r]=[];for(let c=0;c<COLS;c++){
  let g=G_CONC;
  if(r===0||r===ROWS-1||c===0||c===COLS-1) g=G_WALL;
  else if(c===32) g=G_WALL;          // divider indoor/outdoor
  else if(c>32) g=G_SAND;
  ground[r][c]=g; solid[r][c]=(g===G_WALL);
}}
function setG(x,y,w,h,g){for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++)if(ground[r]){ground[r][c]=g;solid[r][c]=(g===G_WALL);}}
function box(x,y,w,h){ // walls perimeter
  for(let c=x;c<x+w;c++){ground[y][c]=G_WALL;solid[y][c]=true;ground[y+h-1][c]=G_WALL;solid[y+h-1][c]=true;}
  for(let r=y;r<y+h;r++){ground[r][x]=G_WALL;solid[r][x]=true;ground[r][x+w-1]=G_WALL;solid[r][x+w-1]=true;}
}
function door(x,y,w,h){for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++){solid[r][c]=false;if(ground[r][c]===G_WALL)ground[r][c]=(c>32?G_SAND:G_CONC);}}

function solidAt(px,py){if(px<0||py<0||px>=WW||py>=WH)return true;const c=px/TILE|0,r=py/TILE|0;return solid[r]?solid[r][c]:true;}
function groundAt(px,py){const c=px/TILE|0,r=py/TILE|0;return ground[r]?ground[r][c]:G_WALL;}

/* ===================== AMBIENT CROWD ===================== */
function rint(n){return Math.random()*n|0;}
function randStyle(){
  const bodies=['#0a0a0a','#111','#15151c','#1a1a1a','#202028','#0d0d0d','#1a0f08','#23201a','#15252a','#101014'];
  const hairs=['#111','#1a1208','#2a2018','#0c0c0c','#3a2a1a','#555','#7a1f1f'];
  const s={body:bodies[rint(bodies.length)],hair:hairs[rint(hairs.length)]};
  if(Math.random()<0.34)s.mustache=1;
  if(Math.random()<0.22){s.cap=Math.random()<0.5?'#111':'#0a0a0a';}
  if(Math.random()<0.30)s.glasses=1;
  if(Math.random()<0.12){s.latex=1;s.body='#0b0b0b';}
  if(Math.random()<0.12)s.harness=1;
  if(Math.random()<0.07)s.glitter=1;
  return s;
}

const keys={};let confirmQueued=false;

  }

  if(state==='dialogue'&&phase==='choice'){for(const r of choiceRects)if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){sel=r.i;confirmQueued=true;return;}}
  confirmQueued=true;
});

/* ===================== AUDIO ===================== */
const audio={ctx:null,on:false,want:false,timer:null,next:0,step:0,
 unlock(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();
   if(this.ctx.state==='suspended')this.ctx.resume();
   try{const b=this.ctx.createBufferSource();b.buffer=this.ctx.createBuffer(1,1,22050);b.connect(this.ctx.destination);b.start(0);}catch(e){}},
 start(){this.unlock();
   if(!this.on&&this.want){this.on=true;this.next=this.ctx.currentTime+0.08;this.timer=setInterval(()=>this.sc(),25);}},
 stop(){this.on=false;if(this.timer)clearInterval(this.timer);if(this.ctx)this.ctx.suspend();},
 sc(){const c=this.ctx,spb=60/126/4;while(this.next<c.currentTime+0.1){this.tk(this.next,this.step);this.step=(this.step+1)%16;this.next+=spb;}},
 tk(t,s){const c=this.ctx;
  if(s%4===0){const o=c.createOscillator(),g=c.createGain();o.type='sine';
   o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+0.12);
   g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
   o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.18);}
  if(s%4===2){const b=c.createBufferSource(),len=c.sampleRate*0.05,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);b.buffer=buf;
   const g=c.createGain();g.gain.value=0.05;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
   b.connect(hp).connect(g).connect(c.destination);b.start(t);}
  if(s%8===4||s%8===6){const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
   o.frequency.value=s%8===4?55:73;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=400;
   g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
   o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+0.2);}}
};

sndBtn.addEventListener('click',()=>{audio.want=!audio.want;sndBtn.textContent='SON: '+(audio.want?'ON':'OFF');audio.want?audio.start():audio.stop();});
function firstGestureUnlock(){audio.unlock();removeEventListener('touchstart',firstGestureUnlock);removeEventListener('mousedown',firstGestureUnlock);}

/* ===================== UPDATE ===================== */
let last=performance.now();
function update(dt){
  const now=performance.now()/1000;
  for(const n of NPCS){n.bob+=dt*4;
    if((n.id==='chelou'||n.type==='dealer')&&state==='play'){
      n.wt-=dt;if(n.wt<=0){n.wt=1+Math.random()*1.5;n.vx=(Math.random()-0.5);n.vy=(Math.random()-0.5);}
      let nx=n.x+(n.vx||0)*9*dt,ny=n.y+(n.vy||0)*9*dt;
      if(Math.hypot(nx-n.hx,ny-n.hy)<24&&!solidAt(nx,n.y)&&groundAt(nx,n.y)!==G_WATER)n.x=nx;
      if(Math.hypot(n.x-n.hx,ny-n.hy)<24&&!solidAt(n.x,ny)&&groundAt(n.x,ny)!==G_WATER)n.y=ny;
    }}
  for(const e of extras)e.bob+=dt*(e.dance?6:3);
  if(state==='play'){
    let dx=0,dy=0;if(keys.up)dy--;if(keys.down)dy++;if(keys.left)dx--;if(keys.right)dx++;
    const swim=groundAt(player.x,player.y)===G_WATER;
    if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;player.ang=Math.atan2(dy,dx);
      const sp=swim?60:78,rr=5;let nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
      if(!solidAt(nx-rr,player.y-rr)&&!solidAt(nx+rr,player.y-rr)&&!solidAt(nx-rr,player.y+rr)&&!solidAt(nx+rr,player.y+rr))player.x=nx;
      if(!solidAt(player.x-rr,ny-rr)&&!solidAt(player.x+rr,ny-rr)&&!solidAt(player.x-rr,ny+rr)&&!solidAt(player.x+rr,ny+rr))player.y=ny;
    }
    // camera
    cam.x=Math.max(0,Math.min(WW-VW,player.x-VW/2));
    cam.y=Math.max(0,Math.min(WH-VH,player.y-VH/2));
    // zone change
    const z=zoneAt(player.x,player.y);
    if(z&&z!==curZone){curZone=z;toast('▸ '+z.n,'#3ff0ff');}
    else if(!z)curZone=null;
    // photobooth
    if(curZone&&curZone.n==='PHOTOMATON'&&now>boothCooldown){
      flashUntil=now+0.35;boothCooldown=now+6;
      const caps=["« moi, naturel »","« avant le drop »","« je vais bien »","« Berlin m'a eu »","« 1 seul verre »","« totalement sobre »"];
      polaroid={until:now+4,caption:caps[Math.random()*caps.length|0]};toast('📸 *clic*','#fff');
    }
    // nearest npc
    near=null;let best=30;for(const n of NPCS){const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<best){best=d;near=n;}}
    if(confirmQueued&&near){dlg=near;line=0;phase='lines';sel=0;result='';state='dialogue';}
    if(woozyUntil>now&&Math.random()<dt*0.4)toast('💧 bois de l\'eau','#3ff0ff');
  }
  else if(state==='dialogue'){
    if(confirmQueued){
      if(phase==='lines'){
        if(line<dlg.lines.length-1)line++;
        else if(dlg.choices){phase='choice';}
        else closeDialogue();
      } else if(phase==='choice'){
        result=dlg.choices[sel].go();phase='result';
      } else { closeDialogue(); }
    }
  }
  else if(state==='title'){if(confirmQueued){state='play';if(audio.want)audio.start();}}
  else if(state==='win'){if(confirmQueued)restart();}
  confirmQueued=false;
}
function closeDialogue(){
  const n=dlg;
  if(n.type==='friend'&&!n.found){n.found=true;friendsFound++;clock+=18;toast('★ ami retrouvé : '+n.id.toUpperCase(),'#7aff7a');}
  if(n.type==='freak'){clock+=40;toast('⏳ tu as perdu 40 minutes...','#ff8a5a');}
  dlg=null;state='play';
  if(friendsFound>=friends.length){clock=6*60+12;state='win';}
}
function restart(){NPCS.forEach(n=>{n.found=false;n.matched=false;n.x=n.hx;n.y=n.hy;});
  friendsFound=0;matchs=0;clock=90;woozyUntil=0;
  player.x=7*TILE+10;player.y=31*TILE+10;player.ang=-Math.PI/2;state='title';}

function drawTile(g,X,Y,c,r){
  const t=performance.now()/1000;
  if(g===G_WALL){px(X,Y,TILE,TILE,'#24242a');px(X,Y,TILE,3,'#36363e');px(X,Y+TILE-3,TILE,3,'#151518');if((c+r)%2)px(X+5,Y+9,3,3,'#1c1c20');}
  else if(g===G_CONC){px(X,Y,TILE,TILE,((c+r)&1)?'#3b3a38':'#363533');px(X,Y,TILE,1,'#444341');if((c*7+r*5)%5===0)px(X+5,Y+12,2,2,'#2c2b29');}
  else if(g===G_SAND){px(X,Y,TILE,TILE,((c+r)&1)?'#6a5d3e':'#655939');px(X,Y,TILE,1,'#766a48');if((c*3+r*9)%6===0)px(X+8,Y+6,2,2,'#564b30');}
  else if(g===G_DECK){px(X,Y,TILE,TILE,((c+r)&1)?'#8a8276':'#827a6e');px(X,Y,TILE,1,'#9a9286');}
  else if(g===G_WOOD){px(X,Y,TILE,TILE,((r)&1)?'#6a4a28':'#5e4122');px(X,Y,TILE,2,'#7a572f');}
  else if(g===G_DARK){px(X,Y,TILE,TILE,'#160a10');if((c+r)%3===0)px(X+9,Y+9,2,2,'#2a0f1f');}
  else if(g===G_STAGE){px(X,Y,TILE,TILE,'#1d1d24');px(X,Y,TILE,2,'#2c2c36');}
  else if(g===G_WATER){const ph=Math.sin(t*1.5+c*0.5+r*0.4);px(X,Y,TILE,TILE,'#15506a');px(X,Y+ (6+ph*4),TILE,2,'rgba(120,220,255,.25)');px(X,Y+TILE-6,TILE,2,'rgba(120,220,255,.15)');}
}
// lit dancefloor overlay drawn in lighting pass
function drawGround(){
  const c0=Math.max(0,cam.x/TILE|0),c1=Math.min(COLS,(cam.x+VW)/TILE+1|0);
  const r0=Math.max(0,cam.y/TILE|0),r1=Math.min(ROWS,(cam.y+VH)/TILE+1|0);
  for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++)drawTile(ground[r][c],c*TILE-cam.x,r*TILE-cam.y,c,r);
}

function drawShadow(x,y){ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+8,9,4,0,0,6.283);ctx.fill();}
function drawPerson(wx,wy,s,bobv,extra){
  const x=wx-cam.x, y=wy-cam.y+(bobv||0), sc=extra&&extra.scale||1;
  drawShadow(wx-cam.x,wy-cam.y);
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  if(s.float){ // floating in pool: ring + head
    px(-9,-3,18,6,'#ffd24a');px(-6,-2,12,4,'#1a6a4a');
    px(-5,-12,10,10,s.body);px(-5,-12,10,3,s.hair);px(-3,-7,2,2,'#111');px(1,-7,2,2,'#111');
    ctx.restore();return;
  }
  // body
  px(-6,-2,12,13,s.body);
  if(s.latex){px(-6,-2,3,13,'rgba(255,255,255,.18)');px(2,0,2,9,'rgba(255,255,255,.10)');}
  if(s.towel){px(-6,3,12,8,'#e8e2d0');px(-6,-2,12,5,s.body);}
  if(s.harness){px(-5,-1,10,2,'#000');ctx.save();ctx.translate(0,4);ctx.rotate(.5);px(-6,-1,12,2,'#000');ctx.rotate(-1);px(-6,-1,12,2,'#000');ctx.restore();px(-1,3,2,2,'#caa');}
  px(-6,-2,12,2,'rgba(255,255,255,.06)');
  // head
  px(-5,-12,10,11,s.skin||'#d2a47c');
  px(-5,-12,10,3,s.hair);px(-3,-7,2,2,'#1a1208');px(1,-7,2,2,'#1a1208');
  if(s.bun)px(-2,-15,4,4,s.hair);
  if(s.glasses)px(-5,-8,10,3,'#0a0a0a'),px(-4,-7,3,1,'rgba(63,240,255,.6)');
  if(s.mustache)px(-3,-3,6,2,'#1a1208');

  if(s.hood){px(-6,-13,12,6,s.body);px(-4,-9,8,7,'#1a0a14');}

  if(s.glitter){const tt=performance.now()/120|0;for(let i=0;i<4;i++)px(-6+((i*5+tt)%12),-13+((i*3)%14),1,1,'#fff');}
  if(s.phone)px(6,-2,3,5,'#0af');

}

   {x:50,y:5,r:75,c:[255,150,40]},   // bar2
   {x:45,y:16,r:95,c:[60,160,255]},  // pool
   {x:48,y:27,r:70,c:[255,120,40]},  // sauna
   {x:28,y:3,r:45,c:[255,255,200]},  // photobooth
  ];
  for(const p of pools){const cx=p.x*TILE-cam.x,cy=p.y*TILE-cam.y;
   if(cx<-p.r||cy<-p.r||cx>VW+p.r||cy>VH+p.r)continue;
   const g=ctx.createRadialGradient(cx,cy,0,cx,cy,p.r);
   g.addColorStop(0,'rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+',.5)');g.addColorStop(1,'rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+',0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);}
  // fire glow (smoking barrel)
  const fx=37.5*TILE-cam.x,fy=27.5*TILE-cam.y;const fr=55+Math.sin(t*6)*8;
  const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,fr);fg.addColorStop(0,'rgba(255,130,30,.6)');fg.addColorStop(1,'rgba(255,130,30,0)');
  ctx.fillStyle=fg;ctx.fillRect(0,0,VW,VH);
  // rotating beams from main DJ
  for(let i=0;i<3;i++){const a=t*0.6+i*2.1,cx=9*TILE-cam.x,cy=2*TILE-cam.y,hue=(t*60+i*120)%360;
   ctx.save();ctx.translate(cx,cy);ctx.rotate(a);const g=ctx.createLinearGradient(0,0,0,260);
   g.addColorStop(0,'hsla('+hue+',100%,60%,.28)');g.addColorStop(1,'hsla('+hue+',100%,60%,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-26,260);ctx.lineTo(26,260);ctx.closePath();ctx.fill();ctx.restore();}
  ctx.globalCompositeOperation='source-over';
  // dark room: force near-black with faint red pulse
  const dx=24*TILE-cam.x,dy=9*TILE-cam.y,dw=8*TILE,dh=8*TILE;
  if(dx<VW&&dy<VH&&dx+dw>0&&dy+dh>0){
   ctx.fillStyle='rgba(2,0,4,.9)';ctx.fillRect(dx,dy,dw,dh);
   const rg=ctx.createRadialGradient(dx+dw/2,dy+dh/2,0,dx+dw/2,dy+dh/2,70);
   rg.addColorStop(0,'rgba(120,10,40,'+(0.12+0.06*Math.sin(t*1.5))+')');rg.addColorStop(1,'rgba(120,10,40,0)');
   ctx.fillStyle=rg;ctx.fillRect(dx,dy,dw,dh);}
  // strobe on both stages
  const cyc=t%4.5;if(cyc<0.32&&(Math.sin(cyc*60)>0)){ctx.fillStyle='rgba(255,255,255,.26)';
   const s1x=2*TILE-cam.x,s1y=1*TILE-cam.y;ctx.fillRect(s1x,s1y,15*TILE,14*TILE);
   const s2x=17*TILE-cam.x,s2y=17*TILE-cam.y;ctx.fillRect(s2x,s2y,13*TILE,11*TILE);}
}

/* ===================== HUD / DIALOGUE / OVERLAYS ===================== */
function hud(){
  px(0,0,VW,16,'rgba(20,16,8,.78)');px(0,16,VW,1,'#463a1e');
  txt('BERGFISCH',6,12,'#ff3fae',11,true);
  txt(fmtClock(),VW/2,12,'#efe3c0',11,true,'center');
  txt('♥ '+matchs,VW-6,12,'#ff3fae',10,true,'right');
  // objective list
  px(6,20,150,14+friends.length*12,'rgba(20,16,8,.6)');
  txt('TROUVE TES AMIS',12,32,'#3ff0ff',10,true);
  friends.forEach((f,i)=>{const nm=f.id.charAt(0).toUpperCase()+f.id.slice(1);
    txt((f.found?'☑ ':'☐ ')+nm,12,46+i*12,f.found?'#7aff7a':'#cfc4a0',10,f.found);});
  if(near&&state==='play'){const lbl='[ E ] '+(near.type==='dealer'?'Aborder':near.type==='freak'?'(éviter ?)':'Parler');
    ctx.font="bold 10px 'Courier New',monospace";const w=ctx.measureText(lbl).width;
    const bx=near.x-cam.x-w/2-6,by=near.y-cam.y-30;
    px(bx,by,w+12,15,'rgba(216,200,160,.95)');px(bx,by,w+12,2,'#efe3c0');px(bx,by+13,w+12,2,'#a8966c');
    txt(lbl,near.x-cam.x,by+11,near.type==='freak'?'#a02020':'#2a2418',10,true,'center');}
}
function wrap(s,max){const w=s.split(' ');const o=[];let cur='';for(const x of w){const tt=cur?cur+' '+x:x;
  if(ctx.measureText(tt).width>max){o.push(cur);cur=x;}else cur=tt;}if(cur)o.push(cur);return o;}
function drawDialogue(){
  choiceRects=[];
  const bx=10,by=VH-94,bw=VW-20,bh=84;
  px(bx,by,bw,bh,'#463a1e');px(bx+2,by+2,bw-4,bh-4,'#d8c8a0');
  px(bx+2,by+2,bw-4,2,'#efe3c0');px(bx+2,by+2,2,bh-4,'#efe3c0');px(bx+bw-4,by+2,2,bh-4,'#a8966c');px(bx+2,by+bh-4,bw-4,2,'#a8966c');
  const ps=58,pbx=bx+8,pby=by+8;
  px(pbx,pby,ps,ps,'#a8966c');px(pbx+2,pby+2,ps-4,ps-4,'#1a1620');
  // portrait
  ctx.save();ctx.translate(pbx+ps/2,pby+ps/2+8);ctx.scale(2.3,2.3);
  const s=dlg.st;px(-9,-2,18,11,s.body);px(-7,-15,14,14,s.skin||'#d2a47c');px(-7,-15,14,4,s.hair);
  px(-4,-7,3,3,'#1a1208');px(2,-7,3,3,'#1a1208');
  if(s.glasses)px(-7,-8,14,3,'#0a0a0a');if(s.mustache)px(-4,-3,8,2,'#1a1208');
  if(s.cap){px(-9,-16,18,5,s.cap);}if(s.hood)px(-9,-16,18,7,'#1a0a14');if(s.latex)px(-9,-2,4,11,'rgba(255,255,255,.2)');
  ctx.restore();
  const tx=pbx+ps+12,tw=bx+bw-tx-10;
  txt(dlg.name,tx,by+20,'#7a1f1f',11,true);px(tx,by+24,tw,1,'#a8966c');
  if(phase!=='choice'){
    const body=phase==='result'?result:dlg.lines[line];
    ctx.font="11px 'Courier New',monospace";const ls=wrap(body,tw);
    ls.forEach((l,i)=>txt(l,tx,by+40+i*13,'#2a2418',11));
    const lastLine=phase==='lines'&&line>=dlg.lines.length-1&&!dlg.choices;
    if((performance.now()/400|0)%2)txt(phase==='result'||lastLine?'■ ESPACE':'▼ ESPACE',bx+bw-12,by+bh-8,'#7a1f1f',10,true,'right');
  } else {
    txt('Que fais-tu ?',tx,by+40,'#2a2418',11);
    dlg.choices.forEach((ch,i)=>{const ox=tx+i*((tw)/dlg.choices.length),ow=tw/dlg.choices.length-6,oy=by+48,oh=24;
      const onsel=i===sel;px(ox,oy,ow,oh,onsel?'#7a1f1f':'#b8a679');px(ox,oy,ow,2,onsel?'#c25050':'#cdbd92');
      txt(ch.l,ox+ow/2,oy+15,onsel?'#fff':'#2a2418',10,true,'center');
      choiceRects.push({x:ox,y:oy,w:ow,h:oh,i});});
  }
}
function overlays(){const now=performance.now()/1000;
  // sauna steam
  if(curZone&&curZone.n==='SAUNA'){ctx.fillStyle='rgba(235,235,235,'+(0.28+0.06*Math.sin(now*2))+')';ctx.fillRect(0,16,VW,VH-16);
    for(let i=0;i<6;i++){const sx=(i*90+now*20)%VW;ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(sx,VH-40-Math.sin(now+i)*20,30,0,6.283);ctx.fill();}}
  // woozy
  if(woozyUntil>now){const k=Math.min(1,(woozyUntil-now)/16);
    ctx.fillStyle='rgba(150,60,220,'+(0.10*k)+')';ctx.fillRect(0,0,VW,VH);}
  // photobooth flash
  if(flashUntil>now){ctx.fillStyle='rgba(255,255,255,'+Math.min(1,(flashUntil-now)/0.35)+')';ctx.fillRect(0,0,VW,VH);}
  // polaroid
  if(polaroid&&polaroid.until>now){const w=68,h=80,x=VW-w-10,y=22;
    px(x-3,y-3,w+6,h+6,'#000');px(x,y,w,h,'#f2eede');px(x+6,y+6,w-12,w-12,'#1a1620');
    // mini fish
    ctx.save();ctx.translate(x+w/2,y+6+(w-12)/2);
    ctx.fillStyle='#f08a2a';ctx.beginPath();ctx.ellipse(0,0,12,8,0,0,6.283);ctx.fill();
    ctx.fillStyle='#d96a1f';ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(-17,-7);ctx.lineTo(-17,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0a0a0a';ctx.fillRect(5,-5,6,8);ctx.restore();
    txt(polaroid.caption,x+w/2,y+h-8,'#2a2418',8,true,'center');}
  // toasts
  let ty=VH-30;for(let i=toasts.length-1;i>=0;i--){const o=toasts[i];if(o.until<now){toasts.splice(i,1);continue;}
    const a=Math.min(1,(o.until-now));ctx.globalAlpha=a;ctx.font="bold 11px 'Courier New',monospace";
    const w=ctx.measureText(o.t).width;px(VW/2-w/2-8,ty-12,w+16,16,'rgba(20,16,8,.8)');
    txt(o.t,VW/2,ty,o.col,11,true,'center');ctx.globalAlpha=1;ty-=20;}
}

/* ===================== SCREENS ===================== */
function drawTitle(){
  cam.x=Math.max(0,Math.min(WW-VW,7*TILE-VW/2));cam.y=Math.max(0,Math.min(WH-VH,28*TILE-VH/2));
  drawGround();drawFurn();extras.forEach(drawExtra);NPCS.forEach(drawNPC);drawFish();lighting();
  ctx.fillStyle='rgba(2,2,6,.64)';ctx.fillRect(0,0,VW,VH);
  txt('BERGFISCH',VW/2,98,'#ff3fae',38,true,'center');
  txt('BERGFISCH',VW/2+1,98,'rgba(63,240,255,.5)',38,true,'center');
  txt('un poisson dans un club à Berlin',VW/2,124,'#efe3c0',13,true,'center');
  txt('Retrouve tes 4 ami·e·s avant le lever du soleil.',VW/2,150,'#cfc4a0',11,false,'center');
  txt('Drague, évite les freaks, perds-toi dans la dark room.',VW/2,168,'#9a9482',10,false,'center');
  if((performance.now()/500|0)%2)txt('▶  ESPACE / TAP pour ENTRER  ◀',VW/2,202,'#3ff0ff',13,true,'center');
  txt('BOUGER : ZQSD / flèches      PARLER : E / espace',VW/2,232,'#9a9482',10,false,'center');
  txt('(active le SON en haut à droite pour le kick)',VW/2,250,'#7a7466',9,false,'center');
}
function drawWin(){
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#2a3a6a');g.addColorStop(.5,'#9a6a7a');g.addColorStop(1,'#e0a05a');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(255,240,180,.9)';ctx.beginPath();ctx.arc(VW/2,VH+10,72,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(40,90,140,.5)';ctx.fillRect(0,VH-70,VW,70);
  cam.x=0;cam.y=0;
  ctx.save();ctx.translate(VW/2,VH-60);ctx.fillStyle='#f08a2a';ctx.beginPath();ctx.ellipse(0,0,12,8,0,0,6.283);ctx.fill();
  ctx.fillStyle='#0a0a0a';ctx.fillRect(5,-5,6,8);ctx.restore();
  ctx.fillStyle='rgba(10,8,20,.4)';ctx.fillRect(0,0,VW,VH);
  txt('06:12',VW/2,64,'#fff',28,true,'center');
  const L=["Le ciel devient gris au-dessus de Berlin.",
   "Tu as retrouvé Chuck, Marco, Nico et Charlo.","Vous finissez tous dans la piscine. Évidemment.",
   "Klaus, depuis l'entrée, te fait un signe de tête.","Le plus grand des honneurs.",
   "","♥ Matchs de la nuit : "+matchs];
  L.forEach((l,i)=>txt(l,VW/2,98+i*19,'#fff5e0',12,i===0||i===6,'center'));
  txt('— FIN —  Bis nächstes Wochenende.',VW/2,250,'#ffd9a0',13,true,'center');
  if((performance.now()/500|0)%2)txt('ESPACE / TAP pour rejouer',VW/2,278,'#fff',11,true,'center');
}

/* ===================== RENDER ===================== */
function render(){
  ctx.clearRect(0,0,VW,VH);
  if(state==='title'){drawTitle();return;}
  if(state==='win'){drawWin();return;}
  drawGround();drawFurn();
  const ents=[...extras.map(e=>({y:e.y,d:()=>drawExtra(e)})),...NPCS.map(n=>({y:n.y,d:()=>drawNPC(n)})),{y:player.y,d:drawFish}];
  ents.sort((a,b)=>a.y-b.y);ents.forEach(e=>e.d());
  lighting();overlays();hud();
  if(state==='dialogue')drawDialogue();
}

/* ===================== LOOP ===================== */
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
